version: '3.8'

services:

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    ports:
      - "5555:5555"
    volumes:
      - "./data:/app/data"

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "1234:1234"
    environment:
      - RECOMMENDER_HOST=server
      - TCP_HOST=server
      - TCP_PORT=5555
      - MONGODB_URI=mongodb://mongo:27017/wolt
    depends_on:
      - server
      - mongo

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  client:
    build:
      context: ./src/client
      dockerfile: Dockerfile
    command: ["python", "client.py", "server", "5555"]
    stdin_open: true
    tty: true
    depends_on:
      - server

volumes:
  mongo-data: