
services:

  server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5555:5555"
    volumes:
      - "./data:/app/data"



  client:
    build:
      context: ./src/client
      dockerfile: Dockerfile

    command: ["python", "client.py", "server", "5555"]
    stdin_open: true
    tty: true
    depends_on:
      - server