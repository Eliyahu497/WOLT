
services:

  server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5555:5555"
    volumes:
      - "./data:/app/data"

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "1234:1234"
    environment:
      - TCP_HOST=server
      - TCP_PORT=5555
    depends_on:
      - server



  client:
    build:
      context: ./src/client
      dockerfile: Dockerfile

    command: ["python", "client.py", "server", "5555"]
    stdin_open: true
    tty: true
    depends_on:
      - server